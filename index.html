<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="src/code.js" defer></script>
    <link rel="stylesheet" href="src/style.css">

    <title>Pagina Web Simples</title>
</head>
<body>
    <div class="container">
        <h1>Gerador de Tabuada Interativo</h1>

        <input id="digito" type="number" name="tabuada"

    </div>

    <div id="resultado">
        <ul id="resultados"></ul>
    </div>
    
</body>
